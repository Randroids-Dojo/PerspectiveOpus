<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A puzzle platformer played on the page and on the stage. Switch between a hand-inked 2D world and a lit 3D world at any moment to restore a scattered symphony." />
    <meta property="og:title" content="Perspective Opus" />
    <meta property="og:description" content="A symphony in two dimensions, and three." />
    <meta property="og:image" content="/og.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Perspective Opus</title>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-mark"><em>Perspective</em><span>Opus</span></div>
      <div class="boot-line"></div>
    </div>
    <style>
      #boot { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 22px;
        background: radial-gradient(ellipse at 50% 45%, #2a1830, #0d0b10 70%); color: #f5ead2; transition: opacity 0.8s ease; }
      #boot.gone { opacity: 0; pointer-events: none; }
      .boot-mark { font: italic 500 44px/0.9 'Cormorant Garamond', Georgia, serif; text-align: center; }
      .boot-mark span { display: block; font-size: 84px; color: #e6c47c; margin-left: 0.3em; }
      .boot-line { width: 160px; height: 1px; background: linear-gradient(90deg, transparent, #e6c47c, transparent);
        animation: boot-line 1.6s ease-in-out infinite; }
      @keyframes boot-line { 0%, 100% { opacity: 0.2; transform: scaleX(0.4); } 50% { opacity: 1; transform: scaleX(1); } }
    </style>
    <div id="world" aria-hidden="true"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
